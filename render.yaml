# Render.com blueprint — deploy via "New > Blueprint" lalu pilih repo ini.
# Isi GEMINI_API_KEY di dashboard Render (Environment > Secret).
services:
  - type: web
    name: ruang-guru-merdeka
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # isi manual sebagai secret di dashboard
    disk:
      name: rgm-data
      mountPath: /app/data
      sizeGB: 1
